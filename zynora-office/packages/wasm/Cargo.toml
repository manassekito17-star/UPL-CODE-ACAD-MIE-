description = "Moteurs ZYNORA (tableur, documents) exposés au navigateur en WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
