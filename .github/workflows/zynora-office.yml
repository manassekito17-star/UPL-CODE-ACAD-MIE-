name: ZYNORA OFFICE

on:
  push:
    paths:
      - "zynora-office/**"
      - ".github/workflows/zynora-office.yml"
  pull_request:
    paths:
      - "zynora-office/**"
      - ".github/workflows/zynora-office.yml"

permissions:
  contents: read

concurrency:
  group: zynora-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: zynora-office

jobs:
  linux:
    name: Linux — qualité, tests, paquets et bout en bout
    runs-on: ubuntu-24.04
    # Large marge : les miroirs apt du runner sont parfois très lents (run n° 22 annulé ainsi).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (WebKitGTK, écran virtuel, WebDriver)
        run: |
          # Nouvel essai automatique d'un téléchargement interrompu ou bloqué.
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "60";\n' | sudo tee /etc/apt/apt.conf.d/80-zynora-retries
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev xvfb webkit2gtk-driver file
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: zynora-office/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: zynora-office/pnpm-lock.yaml
      # Même version que zynora-office/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zynora-office
      - run: pnpm install --frozen-lockfile
      - name: Types (TypeScript strict)
        run: pnpm typecheck
      - name: Tests unitaires et d'interface (Vitest, node:test)
        run: pnpm test
      - name: Format et lint Rust (clippy -D warnings)
        run: pnpm lint:rust
      - name: Tests Rust
        run: cargo test --workspace --locked
      - name: Compatibilité croisée avec LibreOffice (XLSX et DOCX lus et produits par un outil tiers)
        run: |
          sudo apt-get install -y --no-install-recommends libreoffice-calc libreoffice-writer
          cargo test -p zynora-spreadsheet-engine -p zynora-document-engine --locked -- --ignored
      - name: Licences de toutes les dépendances
        run: pnpm check:licenses
      - name: Audit des dépendances npm de production
        run: pnpm audit --prod --audit-level high
      - name: Compilation et paquets Linux (DEB, RPM, AppImage)
        run: pnpm --filter @zynora/desktop tauri build --bundles deb,rpm,appimage
      - name: Pilote WebDriver de Tauri
        run: cargo install tauri-driver --locked
      - name: Test de bout en bout sur l'application compilée
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: zynora-office-linux
          path: |
            zynora-office/target/release/bundle/deb/*.deb
            zynora-office/target/release/bundle/rpm/*.rpm
            zynora-office/target/release/bundle/appimage/*.AppImage
          retention-days: 14

  desktop:
    name: ${{ matrix.name }} — tests et installateurs (non signés)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: msi,nsis
            artifacts: |
              zynora-office/target/release/bundle/msi/*.msi
              zynora-office/target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest
            bundles: app,dmg
            artifacts: |
              zynora-office/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: zynora-office/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: zynora-office/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zynora-office
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --workspace --locked
      - name: Compilation et installateurs
        run: pnpm --filter @zynora/desktop tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: zynora-office-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          retention-days: 14

  android:
    name: Android — APK de test (débogage, non publié)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: zynora-office/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: zynora-office/pnpm-lock.yaml
      # Même version que zynora-office/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zynora-office
      - run: pnpm install --frozen-lockfile
      - name: Compilation de l'APK (arm64)
        run: |
          # NDK figé (même version que celle validée en développement).
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          pnpm --filter @zynora/desktop tauri android build --debug --apk --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: zynora-office-android
          path: zynora-office/apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 14

  # Publication des installateurs dans une version GitHub « aperçu », téléchargeable depuis la
  # page ZYNORA OFFICE du site. Uniquement si TOUTES les compilations et tous les tests ont réussi.
  release:
    name: Publication des installateurs (version « aperçu »)
    needs: [linux, desktop, android]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/dazzling-babbage-7kluja')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Noms de fichiers stables et empreintes SHA-256
        working-directory: .
        run: |
          set -euo pipefail
          mkdir publication
          pick() { find artefacts -type f -name "$1" | head -n 1; }
          cp "$(pick '*.msi')" "publication/ZYNORA-Office-Windows-x64.msi"
          cp "$(pick '*-setup.exe')" "publication/ZYNORA-Office-Windows-x64-setup.exe"
          cp "$(pick '*.dmg')" "publication/ZYNORA-Office-macOS-AppleSilicon.dmg"
          cp "$(pick '*.AppImage')" "publication/ZYNORA-Office-Linux-x86_64.AppImage"
          cp "$(pick '*.deb')" "publication/ZYNORA-Office-Linux-amd64.deb"
          cp "$(pick '*.rpm')" "publication/ZYNORA-Office-Linux-x86_64.rpm"
          cp "$(pick '*.apk')" "publication/ZYNORA-Office-Android-arm64-test.apk"
          (cd publication && sha256sum * > SHA256SUMS.txt)
          ls -la publication
      - name: Version GitHub « zynora-office-preview »
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          Version d'aperçu de ZYNORA OFFICE, compilée et testée automatiquement (commit ${GITHUB_SHA::7}).

          - Installateurs **non signés** : Windows (SmartScreen) et macOS (Gatekeeper) afficheront un avertissement.
          - APK Android de **test** (signature de débogage) : à installer en autorisant les sources inconnues.
          - Vérifiez les fichiers avec SHA256SUMS.txt.
          NOTES
          gh release delete zynora-office-preview --cleanup-tag --yes || true
          gh release create zynora-office-preview publication/* \
            --prerelease --target "$GITHUB_SHA" \
            --title "ZYNORA OFFICE — aperçu" --notes-file notes.md
