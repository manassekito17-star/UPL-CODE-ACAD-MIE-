name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, types, tests, base de données, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests unitaires et contrôle du contenu (pseudocode, Python, C, JS, Java)
        run: npm test
      - name: Migrations, seed et politiques RLS (PGlite)
        run: npm run test:db
      - name: Build
        run: npm run build
      - name: Navigateur pour les tests de bout en bout
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7
